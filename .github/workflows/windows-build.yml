name: Windows build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compute version
        id: ver
        shell: pwsh
        run: echo "version=0.1.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore DIG.sln

      - name: Build
        run: dotnet build DIG.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/DIG.Tests/DIG.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish (self-contained single-file exe)
        shell: pwsh
        run: ./build/publish.ps1 -Configuration Release -Version ${{ steps.ver.outputs.version }} -Output artifacts/app

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$(Resolve-Path artifacts/app)" build/installer/DIG.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload application (exe)
        uses: actions/upload-artifact@v4
        with:
          name: DIG-app-${{ steps.ver.outputs.version }}
          path: artifacts/app/**

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DIG-installer-${{ steps.ver.outputs.version }}
          path: build/installer/Output/*.exe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.ver.outputs.version }}
          path: "**/test-results.trx"
